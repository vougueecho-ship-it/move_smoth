# Build on GitHub (composer/npm work here), deploy to Hostinger via FTP.
# Shared Hostinger Git deploy cannot run composer (proc_open disabled).

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies & build assets
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction
          npm ci
          npm run build

      - name: Prepare FTP target path
        id: ftp-path
        run: |
          path="${{ secrets.FTP_REMOTE_PATH }}"
          if [ -z "$path" ]; then
            echo "FTP_REMOTE_PATH secret is empty"
            exit 1
          fi
          case "$path" in
            */) ;;
            *) path="${path}/" ;;
          esac
          echo "dir=$path" >> "$GITHUB_OUTPUT"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ steps.ftp-path.outputs.dir }}
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/.env.*
            **/storage/logs/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/*.md
            **/cities.sql
            **/states.sql
